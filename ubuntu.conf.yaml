- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- shell:
    - [i3/genconf, "Generating i3 config"]

- link:
    ~/.Xresources: x/Xresources
    ~/.config/alacritty: alacritty
    ~/.config/ghostty: ghostty
    ~/.config/espanso: espanso
    ~/.config/fontconfig/fonts.conf: fonts/fonts.conf
    ~/.config/gammastep: gammastep
    ~/.config/greenclip.toml: greenclip/greenclip.toml
    ~/.config/onagre: onagre
    ~/.config/rofi: rofi
    ~/.config/hypr: hypr
    ~/.config/terminator/config: terminator/config
    ~/.config/user-dirs.conf: xdg/user-dirs.conf
    ~/.config/waybar: waybar
    ~/.fonts/Font-Awesome-7-Brands-Regular-400.otf: fonts/Font-Awesome-7-Brands-Regular-400.otf
    ~/.fonts/Font-Awesome-7-Free-Regular-400.otf: fonts/Font-Awesome-7-Free-Regular-400.otf
    ~/.fonts/Font-Awesome-7-Free-Solid-900.otf: fonts/Font-Awesome-7-Free-Solid-900.otf
    ~/.fonts/Inconsolata-Regular.ttf: fonts/Inconsolata-Regular.ttf
    ~/.fonts/NotoColorEmoji.ttf: fonts/NotoColorEmoji.ttf
    ~/.fonts/SourceCodePro-Regular.otf: fonts/SourceCodePro-Regular.otf
    ~/.i3/config: i3/config
    ~/.i3blocks.conf: i3/i3blocks.conf
    ~/.xbindkeysrc: xbindkeys/xbindkeysrc
    ~/bin/hop: i3/scripts/hop
    ~/bin/i3_switch_workspace.sh: i3/scripts/i3_switch_workspace.sh
    ~/.config/systemd/user/tmux.service: systemd/tmux.service


- shell:
    # Arch: JetBrainsMono Nerd Font from the official 'extra' repo (verify pkg name on your box)
    - ['command -v pacman >/dev/null && sudo pacman -S --needed --noconfirm ttf-jetbrains-mono-nerd || echo "pacman not found; install JetBrainsMono Nerd Font manually"', "Install JetBrainsMono Nerd Font (Arch)"]
    # Ghostty: in the Arch 'extra' repo; note falls back to AUR if unavailable
    - ['command -v pacman >/dev/null && (sudo pacman -S --needed --noconfirm ghostty || echo "ghostty not in pacman repos; install via AUR (ghostty)") || echo "pacman not found; install Ghostty manually"', "Install Ghostty (Arch)"]
    # Rebuild ALL font caches, not just ~/.fonts: the Noto Color Emoji scan-strip in
    # fonts/fonts.conf must also apply to the system copy (/usr/share/fonts/noto, from
    # noto-fonts-emoji) or that copy keeps space/digits and the word-gaps persist.
    - ['([ -x "$(command -v fc-cache)" ] && fc-cache -f -v) || echo "no fc-cache command"', "Regenerate all font caches."]

- shell:
    # tmux-resurrect boot-restore (Linux): enable the --user unit + lingering so
    # it starts at boot without a login session. Guarded on a reachable systemd
    # --user bus / logind so `./install` still succeeds where neither exists
    # (containers, CI) while still surfacing real errors on a systemd host.
    # Idempotent; safe to re-run.
    - ['if systemctl --user show-environment >/dev/null 2>&1; then systemctl --user daemon-reload && systemctl --user enable tmux.service; else echo "no systemd --user session; skipping tmux.service enable (fine in containers/CI)"; fi', "Enable tmux-resurrect boot-restore (systemd --user)"]
    - ['if loginctl list-users >/dev/null 2>&1; then loginctl enable-linger "$USER" 2>/dev/null || sudo loginctl enable-linger "$USER" || echo "could not enable linger; skipping"; else echo "no logind; skipping linger (fine in containers/CI)"; fi', "Linger so the tmux service starts at boot pre-login"]
