# foot terminal config — managed in ~/.dotfiles/foot/ (symlinked to ~/.config/foot, mirrors alacritty)
# Font matched to the Alacritty daily driver: JetBrainsMono Nerd Font Mono, size 14.
# foot's built-in default is monospace:size=8 → unreadably tiny on the 4K DP-1/DP-2 panels.

[main]
font=JetBrainsMono Nerd Font Mono:size=14
# Size points the same way Alacritty does (96 DPI × compositor scale) instead of
# foot's physical-DPI default, so 14pt renders at the same physical size as Alacritty.
dpi-aware=no
pad=8x8

[cursor]
style=block
