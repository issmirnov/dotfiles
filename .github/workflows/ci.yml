name: CI

# Migrated from CircleCI (.circleci/config.yml). Mirrors the two jobs that ran
# there: a full `./install` smoke test on a clean Ubuntu, plus a zsh-shebang lint.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Smoke-test the dotbot install end-to-end on a clean Ubuntu: link everything,
  # install vim plugins, run the per-OS shell steps. Catches broken symlink
  # targets and install steps that fail on a fresh machine.
  install-dotfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3 git wget vim curl zsh jq
      - name: Expose checkout at ~/.dotfiles
        # Some scripts hardcode $HOME/.dotfiles (e.g. i3/genconf does
        # ROOT="$HOME/.dotfiles/i3"), and the dotbot link targets assume the repo
        # lives there. CircleCI used working_directory: ~/.dotfiles and Travis did
        # `ln -s $TRAVIS_BUILD_DIR $HOME/.dotfiles`; mirror that so genconf writes
        # i3/config into the checkout instead of a nonexistent ~/.dotfiles.
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
      - name: Prepare link-target dirs
        run: mkdir -p ~/.i3 ~/.config
      - name: Install bat (sharkdp)
        run: |
          U=$(curl -sSL https://api.github.com/repos/sharkdp/bat/releases/latest \
            | jq -r -c 'first(.assets[] | select(.browser_download_url | contains("bat_") and contains("amd64.deb") and (contains("musl") | not))) | .browser_download_url')
          wget "$U"
          sudo dpkg -i "$(basename "$U")"
      - name: Run install script
        run: cd "$HOME/.dotfiles" && ./install
      - name: Lint zsh shebangs
        run: cd "$HOME/.dotfiles/zsh" && if [[ $(grep -r '#!/bin/zsh' . --exclude-dir=zgen) ]]; then echo "Found malformed shebangs"; exit 1; fi

  # Fast, standalone lint so a shebang regression is flagged even if the full
  # install job fails earlier for an unrelated reason.
  check-zsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint zsh shebangs
        run: cd zsh && if [[ $(grep -r '#!/bin/zsh' . --exclude-dir=zgen) ]]; then echo "Found malformed shebangs"; exit 1; fi

  # Paste regression tests for zsh/config/zsh-paste.zsh. Each test runs an
  # interactive zsh on a pty and pastes with timed pauses. Its own job, so a
  # flaky step in the install job can't hide a failure here.
  test-zsh-paste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run paste tests
        run: python3 -m unittest -v tests.test_zsh_paste

  # Status line rendering for claude/statusline-command.sh: both rows, the host,
  # the launch directory, moves, worktrees and narrow-window shortening. Runs the
  # script on JSON payloads; the runner image already has bash, jq and git.
  test-statusline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run status line tests
        run: python3 -m unittest -v tests.test_statusline

  # tmux-resurrect boot restore: the post-save hook that records each Claude pane's
  # session ID, the restore entries in tmux.conf (run through resurrect's own
  # matching code), the unit's enable script, and resurrect-save (the minute timer's
  # and the shutdown saver's save). Fakes tmux, ps, /proc, systemctl, busctl and gdbus.
  test-tmux-resurrect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out tmux-resurrect
        run: git submodule update --init tmux/plugins/tmux-resurrect
      - name: Run tests
        run: bash tmux/tests/resurrect-claude-ids.test.sh
      - name: Run resurrect-save tests
        run: bash tmux/tests/resurrect-save.test.sh
