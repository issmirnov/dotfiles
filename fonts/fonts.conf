<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- (1) Strip ASCII/Latin (U+0000-U+02FF: space, digits, '#', '*', (c), (r), ...)
       from Noto Color Emoji's charset at scan time. Noto renders these at emoji
       em-width, so whenever it wins the fallback for them the result is giant word
       gaps ("My      Media") and oversized digits in Chrome/Electron. Removing them
       from its charset guarantees plain text chars always come from a text font, no
       matter how highly Noto is ranked below it. Real emoji (>= U+0300, incl. ZWJ
       U+200D and combining keycap U+20E3) are left untouched. -->
  <match target="scan">
    <test name="family"><string>Noto Color Emoji</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x0</int><int>0x2FF</int></range>
        </charset>
      </minus>
    </edit>
  </match>

  <!-- (2) Pin real text fonts for the generic families. fontconfig 2.18 changed
       family scoring so the strong emoji append below wins *charset-less* generic
       lookups: `fc-match monospace` -> Noto Color Emoji, which (post-strip) has no
       text glyphs. Apps that resolve a generic family to a single font up front
       (xterm, some toolkits) then render blank/invisible text. Strong-prepending a
       real text font makes the generic resolve to text again, while per-character
       emoji fallback (rule 3) still works. Swap these for your preferred defaults.
       Verify: `fc-match monospace` -> DejaVu Sans Mono   (NOT Noto Color Emoji). -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Serif</string></edit>
  </match>

  <!-- (3) Color-emoji fallback. Font Awesome 7 (otf-font-awesome) squats real emoji
       codepoints (U+1F534 red, U+1F7E1 yellow, U+1F7E2 green circles — the i3/bar
       status dots — and more) and fontconfig otherwise ranks its monochrome outline
       glyphs ABOVE Noto Color Emoji, so those emoji render as hollow gray rings. A
       STRONG append puts Noto high enough to win the fallback for emoji the text
       font lacks. Safe for text now because (a) rule 1 stripped ASCII/Latin from
       Noto and (b) rule 2 owns the charset-less generic lookups.
       Verify: `fc-match sans-serif:charset=1f534` -> Noto Color Emoji.
       Tradeoff: codepoints DejaVu itself covers (e.g. U+2764 heart, U+1F600) resolve
       to DejaVu (monochrome) in the generic path; color-emoji apps use emoji
       presentation and still get Noto. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
