# set history to 100k lines
set -g history-limit 100000

# set window and pane index to 1 (0 by default)
set-option -g base-index 1
setw -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# Make things more responsive
set -g repeat-time 0
set -s escape-time 0

# reload ~/.tmux.conf using PREFIX r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

## add more convenient split shortcuts
bind | split-window -h
bind - split-window -v

# ── Catppuccin Mocha status bar (mouse-friendly) ────────────────────────────
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 60
set -g status-right-length 200
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g message-command-style "bg=#f9e2af,fg=#1e1e2e,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Left: session pill (peach while prefix held) +  clickable new-window button
set -g status-left "#[fg=#1e1e2e,bg=#{?client_prefix,#fab387,#cba6f7},bold]  #S #[fg=#{?client_prefix,#fab387,#cba6f7},bg=#1e1e2e,nobold]#[fg=#7f849c,bg=#1e1e2e,range=user|newwin]  #[norange,default] "

# Windows: current = blue pill ([Z]=zoomed); others subdued, and turn amber on a
# bell (monitor-bell is on by default) — Claude's Notification hook rings the pane
# bell so a background window that "needs you" lights up, clearing when you focus it.
# Divider = a fine powerline soft-chevron (U+E0B1) baked as a LEADING element on each
# non-current window (window-status-separator is empty). Suppressed on the window right
# after the current pill so it never doubles with that pill's hard arrow cap; the first
# window's leading chevron also divides the "+" button from the window list.
set -g window-status-separator ""
set -g window-status-format "#{?#{==:#{window_index},#{e|+|:#{active_window_index},1}},,#[fg=#6c7086#,bg=#45475a]}#{?window_bell_flag,#[fg=#1e1e2e#,bg=#f9e2af#,bold],#[fg=#bac2de#,bg=#45475a]} #I #W#{?#{>:#{window_panes},1},  #{window_panes},}#{?#{m:*claude*,#{pane_current_command}}, #{?window_bell_flag,#[fg=#1e1e2e],#[fg=#fab387]}✶#{?window_bell_flag,#[fg=#1e1e2e],#[fg=#bac2de]},} "
# Current pill's powerline caps are colored by position so they blend into whatever is
# beside them — the bar (#1e1e2e) when the window is first/last, a gray pill (#45475a)
# otherwise. Assuming gray unconditionally left a mismatched cap sliver ("bleed") vs the bar.
set -g window-status-current-format "#[fg=#{?#{==:#{window_index},1},#1e1e2e,#45475a},bg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W#{?#{>:#{window_panes},1},  #{window_panes},}#{?#{m:*claude*,#{pane_current_command}}, #[fg=#fab387]✶#[fg=#1e1e2e],}#{?window_zoomed_flag,  [Z],} #[fg=#89b4fa,bg=#{?#{==:#{window_index},#{session_windows}},#1e1e2e,#45475a}]#[default]"

# Right: cwd · clock · host
set -g status-right "#[fg=#585b70,bg=#1e1e2e]#[fg=#cdd6f4,bg=#585b70]  #{b:pane_current_path}#[fg=#a6e3a1,bg=#585b70]#(cd '#{pane_current_path}' 2>/dev/null; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's,.*,   &,')#[fg=#cdd6f4,bg=#585b70] #[fg=#89b4fa,bg=#585b70]#[fg=#1e1e2e,bg=#89b4fa,bold]  %H:%M #[fg=#b4befe,bg=#89b4fa]#[fg=#1e1e2e,bg=#b4befe,bold]  #h #[default]"

# Clickable  button makes a window; clicking a window name still selects it
bind -T root MouseDown1Status if-shell -F "#{==:#{mouse_status_range},newwin}" "new-window" "select-window -t="

# Set window notifications
setw -g monitor-activity on
set -g visual-activity on

# make active pane more distinct
set -g pane-active-border-style fg=yellow,bg=default

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# disable autonaming of panes
set-option -g allow-rename off

# modern terminfo (proper italics/underline); tmux-256color terminfo verified present
set -g default-terminal "tmux-256color"
# 24-bit truecolor in Alacritty (both machines); only claims RGB for TERM=alacritty
set -as terminal-features ",alacritty:RGB"

# New windows/pane in $PWD
bind c new-window -c "#{pane_current_path}"

# Enable mouse: click a pane/window to select, drag a border to resize, drag to
# copy. Wheel scrolling is left to tmux's native binding (forwards to vim/less,
# else copy-mode scrollback); the old hand-rolled override was removed 2026-07-12.
set -g mouse on

# Remote clipboard over SSH: set-clipboard "on" makes tmux emit OSC 52 on copy,
# so yanks reach the LOCAL clipboard even when tmux runs on a remote host (the
# default "external" only accepts OSC 52, never sends it). Needs an OSC 52-aware
# terminal — Alacritty has osc52 = "CopyPaste". '*' covers non-xterm TERM values.
set -s set-clipboard on
set -ag terminal-features ',*:clipboard'

# Local clipboard integration via tmux-yank (xclip on Linux / pbcopy on macOS).
# https://github.com/tmux-plugins/tmux-yank#controlling-yank-behavior
# NOTE: these @-options MUST be set BEFORE run-shell — the plugin binds its copy
# keys as it loads, so an override set afterwards is ignored and it falls back to
# auto-detection (which picks wl-copy on this box, broken under X11). Remote /
# over-SSH clipboards are handled by the OSC 52 block above; this is the local path.
if-shell 'test "$(uname)" = "Darwin"' \
    'set -g @override_copy_command "pbcopy"' \
    'set -g @override_copy_command "xclip -selection clipboard -i"'
set -g @yank_with_mouse on
run-shell ~/.dotfiles/tmux/plugins/tmux-yank/yank.tmux

# Middle-click pastes the system clipboard, not tmux's own buffer (one shared
# clipboard, see ~/.dotfiles/hypr/scripts/clipsync). In foot, tmux asks the
# terminal for its clipboard over OSC 52 (refresh-client -l), gives the reply a
# moment to land as the newest paste buffer, then pastes it. Works over ssh too.
# Copy mode and other terminals (Ghostty asks before every clipboard read) keep
# tmux's default.
bind -n MouseDown2Pane select-pane -t = \; if -F '#{&&:#{m:foot*,#{client_termtype}},#{!:#{pane_in_mode}}}' { refresh-client -l ; run -d 0.25 ; paste-buffer -p } { if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { paste-buffer -p } }

## ── Session persistence: resurrect + continuum ───────────────────────────
# Save/restore the full tmux environment (windows, panes, cwd, layout) across
# restarts and reboots. Vendored as submodules under tmux/plugins/ (like yank).
#   Manual save:    prefix + Ctrl-s        Manual restore: prefix + Ctrl-r
# Restore is done by the systemd --user unit tmux-resurrect.service at boot
# (start-server + ExecStartPost run-shell restore.sh); continuum's own
# @continuum-restore is OFF -- it races at cold boot. The unit is not named
# tmux.service, because with @continuum-boot off every config load runs
# `systemctl --user disable tmux.service`.
#
# Saving: continuum saves from the status line, so only while a client is attached,
# every 15 min, and never at shutdown. A Claude pane started after the last save came
# back as a bare shell. On Linux, tmux/resurrect-save saves instead, from
# tmux-resurrect-save.timer (every 60 s, attached or not) and
# tmux-resurrect-shutdown.service (at shutdown or reboot, before any pane stops).
# Where that timer is enabled, continuum's autosave is off, so two savers never write
# the same file. Elsewhere (macOS), continuum still autosaves every 15 min.
#
# Claude panes come back by session ID. The post-save hook rewrites each Claude
# pane's saved command to `sesh-local --sid <id>`, which restore runs as is.
# sesh-local launches ccf, or plain claude where ccf is not defined. A pane with no
# known ID falls back to --continue (the newest conversation in its directory).
# Only one entry may match a command: resurrect types every match into the pane.
set -g @resurrect-capture-pane-contents 'on'                 # keep each pane's visible scrollback
set -g @resurrect-processes '"~claude->~/.dotfiles/sesh/sesh-local . continue --continue" "sesh-local --sid->~/.dotfiles/sesh/sesh-local --sid *"'
set -g @resurrect-hook-post-save-layout '~/.dotfiles/tmux/resurrect-claude-ids'
set -g @resurrect-delete-backup-after '3'                    # days; the newest 5 saves are always kept. The minute timer can add a file a minute.
set -g @continuum-restore 'off'                             # restore is done synchronously by the systemd unit (ExecStartPost); continuum's own auto-restore races at cold boot.
if-shell 'systemctl --user is-enabled tmux-resurrect-save.timer >/dev/null 2>&1' \
    "set -g @continuum-save-interval '0'" \
    "set -g @continuum-save-interval '15'"                   # minutes between continuum autosaves; 0 (off) where the save timer runs
set -g exit-empty off                                        # keep the server alive with 0 sessions (boot: start-server, then restore fills it)

# resurrect must load before continuum (continuum builds on it); keep last.
run-shell ~/.dotfiles/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.dotfiles/tmux/plugins/tmux-continuum/continuum.tmux

# ── Outer terminal title + Ghostty truecolor (added 2026-10-06) ─────────────
# Label the host terminal's window/tab from tmux so each Ghostty tab reads
# "session · window" (e.g. "cc-argo · nvim"). The title OSC survives mosh.
set -g set-titles on
set -g set-titles-string "#S · #W"
# Truecolor parity for Ghostty (TERM=xterm-ghostty), matching the alacritty line.
set -as terminal-features ",xterm-ghostty:RGB"
