# fuzzel theme — Catppuccin Mocha (catppuccin.com/palette).
# Used by the SUPER+Space switcher (~/.dotfiles/hypr/scripts/hypr-switch) and any
# other fuzzel/dmenu call. fuzzel reads this on every launch — no reload needed.

[main]
font=monospace:size=13
anchor=center
lines=14
width=50
horizontal-pad=22
vertical-pad=16
inner-pad=12

[colors]
background=1e1e2ef5
text=cdd6f4ff
match=89b4faff
selection=cba6f7ff
selection-text=11111bff
selection-match=1e1e2eff
border=b4befeff

[border]
width=2
radius=16
