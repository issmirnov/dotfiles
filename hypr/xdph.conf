# xdg-desktop-portal-hyprland config  (~/.config/hypr → ~/.dotfiles/hypr symlink)
# Read at xdph startup; the "PORTALS FIRST" autostart in hyprland.lua restarts xdph
# each login so this applies from boot.
#
# allow_token_by_default: honor an app's saved screencast restore token WITHOUT
# re-showing the picker. Chrome already asks to persist (SelectSources logs
# "persist_mode to 1"); with this on, xdph logs "restore data valid, not prompting"
# and reuses your last-selected screen/window. Effect:
#   - collapses Meet's double-prompt (the 2nd "present" phase reuses the 1st pick)
#   - repeat shares of the SAME source skip the picker entirely
#   - first share after a Chrome restart still prompts once (Chrome uses persist_mode=1
#     = valid only while Chrome runs), then repeats are silent again
# To share a DIFFERENT window/screen: use Chrome's share bar → "Share this window/screen
# instead" (or stop + restart Chrome to clear the token). Trade-off: an app you've
# granted can silently re-capture its last source while its token is valid — fine on a
# personal desktop. Set to false or delete this file to go back to prompting every time.
# Diagnosed/added 2026-08-07 (see wayland-screenshare notes).
screencopy {
    allow_token_by_default = true
    max_fps = 60
}
