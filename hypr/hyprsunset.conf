# hyprsunset — blue-light filter for Hyprland (replaces the ancient wlsunset 0.4.0).
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
# Runtime control: hyprctl hyprsunset temperature <K> | identity | gamma <pct>
# Query current:   hyprctl hyprsunset temperature
#
# WARNING: hyprsunset switches on FIXED wall-clock profile times, NOT astronomical
#   sunset (wlsunset did compute the sun). Denver sunset drifts ~16:40 (Dec) .. 20:30
#   (Jun); the times below suit late summer. Adjust seasonally, or ask to switch to a
#   sun-tracked systemd timer that drives `hyprctl hyprsunset temperature` from a NOAA
#   solar calc (reuse ~/.dotfiles/bin/hexane-nightlight's sun_times()).

max-gamma = 100

# Daytime — mild warmth, matching the old wlsunset day temp. Swap to `identity = true`
# if you'd prefer no tint at all during the day.
profile {
    time = 7:00
    temperature = 4500
}

# Night — warm, from ~sunset.
profile {
    time = 19:45
    temperature = 3200
}
