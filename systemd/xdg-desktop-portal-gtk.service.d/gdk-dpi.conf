[Service]
# hexane runs 4K monitors at scale=1, so GTK's default 96 DPI makes the
# portal-rendered file picker (Slack/Electron/any Wayland app "Open Files"
# dialog) tiny. GDK_DPI_SCALE enlarges fonts only (not widget geometry),
# matching the per-app approach used elsewhere (nemo @1.4). Bump the value to
# taste. Applies to xdg-desktop-portal-gtk, which serves org.freedesktop.
# portal.FileChooser for every app on this Hyprland session.
Environment=GDK_DPI_SCALE=1.5
