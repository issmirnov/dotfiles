- defaults:
    link:
      relink: true
      create: true
      force: true
- clean: ['~']
- shell:
    - [skhd/generator.sh, "Generating skhd config"]
    - ['command -v brew >/dev/null && brew install --cask font-jetbrains-mono-nerd-font || echo "brew not found; install JetBrainsMono Nerd Font manually"', "Install JetBrainsMono Nerd Font"]
    - ['command -v brew >/dev/null && brew install --cask ghostty || echo "brew not found; install Ghostty manually"', "Install Ghostty"]

- link:
    "~/Library/Application Support/Übersicht/widgets": ubersicht
    ~/.config/karabiner/karabiner.json: karabiner/karabiner.json
    ~/.config/borders/bordersrc: borders/bordersrc
    ~/.skhdrc: skhd/skhdrc.generated
    ~/.yabairc: yabai/yabairc
    ~/.config/alacritty: alacritty
    ~/.config/ghostty: ghostty
    ~/Library/Fonts/Inconsolata-Regular.ttf: fonts/Inconsolata-Regular.ttf
    ~/Library/Fonts/SourceCodePro-Regular.otf: fonts/SourceCodePro-Regular.otf
    ~/Library/Preferences/espanso: espanso
    ~/bin/lock: bin/osx_lock
    ~/Library/LaunchAgents/localhost.tmux-resurrect.plist: MacOS-LaunchAgents/localhost.tmux-resurrect.plist

- shell:
    # tmux-resurrect login-restore (macOS): (re)load the launchd agent. macOS has
    # no boot-without-login, so this fires at login (RunAtLoad in the plist).
    - ['launchctl unload ~/Library/LaunchAgents/localhost.tmux-resurrect.plist 2>/dev/null; launchctl load -w ~/Library/LaunchAgents/localhost.tmux-resurrect.plist', "Load tmux-resurrect login-restore agent (launchd)"]
